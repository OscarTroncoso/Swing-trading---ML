name: Full V3.3 research suite
on:
  workflow_dispatch:
  push:
    branches:
      - v3.3-risk-ml-rework
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'config.json'
      - '.github/workflows/research.yml'
permissions:
  contents: write
concurrency:
  group: v33-research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Tests
        run: pytest -q
      - name: Freeze exact 10-year EURUSD OHLC
        run: python scripts/fetch_market.py --period 10y --out data/research_10y.csv
      - name: Compare V3.1 V3.2 V3.3
        run: python scripts/backtest_v33.py --csv data/research_10y.csv --start 2026-01-01
      - name: Robust V3.3 policy search using 2020-2025 only
        run: python scripts/v33_policy_research.py --csv data/research_10y.csv
      - name: Non-time exit policy research
        run: python scripts/v33_exit_research.py --csv data/research_10y.csv
      - name: ML model-family research on TP-before-SL labels
        run: python scripts/ml_v33_research.py --csv data/research_10y.csv --start 2026-01-01
      - name: Commit refreshed V3.3 research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research_10y.csv reports/*.csv reports/*.json
          git diff --cached --quiet || git commit -m "research: refresh V3.3 EUR-stake and ML results"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: eurusd-v33-full-research
          path: |
            data/research_10y.csv
            data.json
            reports/*.csv
            reports/*.json
