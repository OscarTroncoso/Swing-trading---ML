name: V4 research and dashboard
on:
  workflow_dispatch:
  push:
    branches:
      - v4-risk-ml-rework
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'config.json'
      - 'requirements.txt'
      - '.github/workflows/research.yml'
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Tests
        run: pytest -q
      - name: Freeze exact EURUSD OHLC sample
        run: python scripts/update_data.py --period 10y --backtest-start 2026-01-01 --out data.json --market-csv-out data/research_10y.csv
      - name: V3.1 vs V4 vs V4-ML advisory
        run: python scripts/backtest_2026.py --csv data/research_10y.csv --start 2026-01-01
      - name: Multi-year V4 architecture and leverage research
        run: python scripts/v4_research.py --csv data/research_10y.csv --first-year 2020 --last-year 2026
      - name: Commit refreshed V4 outputs
        if: github.ref == 'refs/heads/v4-risk-ml-rework'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json data.equity.csv data/research_10y.csv reports/*.csv reports/*.json
          git diff --cached --quiet || git commit -m "research: refresh V4 model results"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: eurusd-v4-research
          path: |
            data/research_10y.csv
            data.json
            reports/*.csv
            reports/*.json
