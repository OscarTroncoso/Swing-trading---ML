<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operaciones V3.2</title><style>body{margin:0;padding:20px;background:#0f172a;color:#f8fafc;font-family:Inter,Segoe UI,sans-serif}.wrap{max-width:1500px;margin:auto}a{color:#60a5fa;text-decoration:none}.card{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:16px;margin-top:18px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1250px}th,td{padding:9px;border-bottom:1px solid #334155;font-size:.8rem;text-align:left}th{color:#94a3b8}.green{color:#10b981}.red{color:#ef4444}h1{font-size:1.4rem}.note{color:#94a3b8;font-size:.8rem}</style></head><body><div class="wrap"><a href="index.html">← Dashboard</a><h1>Historial de operaciones — V3.2 actual</h1><p class="note">Solo operaciones generadas por el modelo actual. No utiliza el antiguo Google Sheets Trade Journal.</p><div class="card scroll"><table><thead><tr><th>Signal</th><th>Entry</th><th>Exit</th><th>Side</th><th>Entry Px</th><th>Exit Px</th><th>Initial SL</th><th>TP</th><th>Trend</th><th>Vol</th><th>Stop</th><th>Units</th><th>Leverage</th><th>Risk EUR</th><th>P&L</th><th>R</th><th>MAE R</th><th>MFE R</th><th>Capture</th><th>Reason</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>
fetch(`data.json?t=${Date.now()}`).then(r=>r.json()).then(d=>{document.getElementById('rows').innerHTML=(d.trades||[]).slice().reverse().map(t=>`<tr><td>${String(t.signalDate).slice(0,10)}</td><td>${String(t.entry).slice(0,10)}</td><td>${String(t.exit).slice(0,10)}</td><td class="${t.side==='LONG'?'green':'red'}">${t.side}</td><td>${Number(t.entryPrice).toFixed(5)}</td><td>${Number(t.exitPrice).toFixed(5)}</td><td>${Number(t.stopLoss).toFixed(5)}</td><td>${Number(t.takeProfit).toFixed(5)}</td><td>${t.trendScore}/5 ${t.trendRegime}</td><td>${t.volatilityRegime||'—'}</td><td>${t.stopSource} ${Number(t.stopDistanceATR||0).toFixed(2)}ATR</td><td>${Number(t.units||0).toLocaleString()}</td><td>${Number(t.leverage||0).toFixed(2)}×</td><td>€${Number(t.initialRiskEUR||0).toFixed(2)}</td><td class="${Number(t.profitEUR)>=0?'green':'red'}">€${Number(t.profitEUR||0).toFixed(2)}</td><td>${Number(t.rMultiple||0).toFixed(2)}</td><td>${Number(t.maeR||0).toFixed(2)}</td><td>${Number(t.mfeR||0).toFixed(2)}</td><td>${t.captureRatio==null?'—':Number(t.captureRatio).toFixed(2)}</td><td>${t.reason}</td></tr>`).join('')});
</script></body></html>
